<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img"><title>总体系统示意图</title><desc>概念图，非比例、坐标未定。线型与文字共同标识证据；颜色只表示角色。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#64748b" stroke-width="1.4"/></marker></defs><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><rect width="1200" height="330" fill="white"/><text x="36" y="39" fill="#263238" font-size="25" font-weight="600" text-anchor="start">总体系统示意图</text><text x="36" y="71" fill="#64748b" font-size="16" font-weight="400" text-anchor="start">格式示例｜非真实设计</text><path d="M356.6666666666667,179.0H473.6666666666667" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="416.6666666666667" y="163.0" fill="#475569" font-size="15" font-weight="400" text-anchor="middle">待验证</text><path d="M723.3333333333334,179.0H840.3333333333334" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="783.3333333333334" y="163.0" fill="#475569" font-size="15" font-weight="400" text-anchor="middle">待验证</text><rect x="110.0" y="124" width="246.66666666666669" height="110" rx="5" fill="#cce5ff" stroke="#3366cc" stroke-width="1"/><text x="233.33333333333334" y="186.0" fill="#263238" font-size="21" font-weight="400" text-anchor="middle">输入 / 启动事件</text><rect x="476.6666666666667" y="124" width="246.66666666666669" height="110" rx="5" fill="#ffd8a8" stroke="#b85c00" stroke-width="1"/><text x="600.0" y="186.0" fill="#263238" font-size="21" font-weight="400" text-anchor="middle">调控 / 核心执行</text><rect x="843.3333333333334" y="124" width="246.66666666666669" height="110" rx="5" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="1"/><text x="966.6666666666667" y="186.0" fill="#263238" font-size="21" font-weight="400" text-anchor="middle">输出 / 检测读数</text><text x="36" y="283" fill="#475569" font-size="16" font-weight="400" text-anchor="start">角色：蓝＝输入/感知　橙＝执行　绿＝输出/检测　灰＝对照　红＝风险/阻断</text><text x="36" y="311" fill="#64748b" font-size="15" font-weight="400" text-anchor="start">线型：实线＝直接证据/计算结果/流程顺序；虚线＝间接/待验证/缺失/概念。以箭头文字及图注为准。</text></g></svg>